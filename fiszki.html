<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiszki rosyjsko-polskie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600&display=swap">
<style>
:root{--bg:#f3efe6;--ink:#1d2a3a;--muted:#5d6a78;--front:#fffdf8;--back:#1d2a3a;--backink:#f3efe6;--line:#d8d1c0;--accent:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121821;--ink:#e8e4d8;--muted:#9aa5b1;--front:#1c2530;--back:#e8e4d8;--backink:#1d2a3a;--line:#2d3947;--accent:#ff8a80}}
:root[data-theme="dark"]{--bg:#121821;--ink:#e8e4d8;--muted:#9aa5b1;--front:#1c2530;--back:#e8e4d8;--backink:#1d2a3a;--line:#2d3947;--accent:#ff8a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font:600 1.4rem/1.2 Literata,Georgia,serif;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.scene{perspective:1200px;height:280px;margin:0 0 16px}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1);cursor:pointer;border:0;padding:0;background:none;display:block;font:inherit;color:inherit}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow-wrap:anywhere}
.front{background:var(--front);border:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
.back{background:var(--back);color:var(--backink);transform:rotateY(180deg)}
.word{font:600 clamp(1.8rem,8vw,2.6rem)/1.15 Literata,Georgia,serif}
.lang{font-size:.85rem;color:var(--muted);margin-top:14px}
.back .lang{color:var(--backink);opacity:.7}
.card:focus-visible,button.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.decksel{margin-bottom:16px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.count{color:var(--muted);font-variant-numeric:tabular-nums;min-width:4.5em;text-align:center}
.btn{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--front);color:var(--ink);cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
form{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:20px}
h2{font:600 1.1rem Literata,Georgia,serif;margin:0}
label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
select,input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--front);color:var(--ink);min-height:44px;width:100%}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
<h1>Fiszki rosyjsko-polskie</h1>
<p class="sub">Kliknij kartę albo naciśnij spację, aby ją obrócić. Strzałki przełączają fiszki.</p>

<div class="tabs"><button class="btn tab on" id="tabS">Słówka</button><button class="btn tab" id="tabW">Wyrażenia</button></div>
<label class="decksel">Zestaw<select id="deck"></select></label>

<div class="scene">
  <button class="card" id="card" aria-label="Obróć fiszkę">
    <span class="face front"><span class="word" id="fw"></span><span class="lang" id="fl"></span></span>
    <span class="face back"><span class="word" id="bw"></span><span class="lang" id="bl"></span></span>
  </button>
</div>

<div class="row">
  <button class="btn" id="prev" aria-label="Poprzednia fiszka">Wstecz</button>
  <span class="count" id="count"></span>
  <button class="btn primary" id="next" aria-label="Następna fiszka">Dalej</button>
</div>

<div class="tools">
  <button class="btn" id="shuffle">Pomieszaj</button>
  <button class="btn" id="dir">Kierunek: polski → rosyjski</button>
  <button class="btn" id="del">Usuń tę fiszkę</button>
</div>

<form id="add" autocomplete="off">
  <h2>Dodaj własną fiszkę</h2>
  <label>Po rosyjsku<input id="ru" lang="ru" required></label>
  <label>Po polsku<input id="pl" lang="pl" required></label>
  <button class="btn primary" type="submit">Dodaj fiszkę</button>
</form>
</main>
